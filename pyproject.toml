[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-github"
version = "0.1.0"
description = "AI developer assistant that ingests GitHub repos and answers queries with grounded code citations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}

dependencies = [
    # Core
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer[all]>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Parsing
    "tree-sitter>=0.21,<0.26",
    "tree-sitter-language-pack>=0.3",

    # Embeddings & ML
    "sentence-transformers>=3.0",
    # Jina v2 custom model code imports helpers removed in Transformers 4.49.
    "transformers>=4.41,<4.49",
    "torch>=2.0",
    "fastembed>=0.4",
    "numpy>=1.26",

    # Vector DB
    "qdrant-client>=1.12",

    # Graph DB
    "neo4j>=5.20",

    # LangChain
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-qdrant>=0.2",
    "langchain-community>=0.3",
    "langsmith>=0.2",

    # Git
    "gitpython>=3.1",

    # Utils
    "rich>=13.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
rag-github = "rag_github.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_github"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
