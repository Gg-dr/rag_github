<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141d">
  <title>Repo Guide</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #0c1018; color: #edf1f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 15% 0%, #1c2c3c, #0c1018 48%); }
    main { width: min(760px, calc(100% - 32px)); margin: auto; padding: 72px 0 60px; }
    .eyebrow { color: #8bd5bd; font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(2.1rem, 6vw, 3.5rem); line-height: 1.1; letter-spacing: -.045em; }
    .intro { margin: 0 0 32px; max-width: 580px; color: #aab5c6; }
    .panel { padding: 24px; border: 1px solid #2a3545; border-radius: 18px; background: #141b26ef; box-shadow: 0 20px 70px #0005; }
    label { display: block; margin: 0 0 8px; color: #d4dce8; font-size: .9rem; font-weight: 650; }
    input, textarea { width: 100%; border: 1px solid #354357; border-radius: 10px; outline: none; padding: 13px 14px; color: #edf1f8; background: #0e141e; font: inherit; }
    textarea { min-height: 108px; resize: vertical; }
    input:focus, textarea:focus { border-color: #70c9ad; box-shadow: 0 0 0 3px #70c9ad20; }
    .row { display: flex; gap: 10px; align-items: end; }
    .row input { flex: 1; min-width: 0; }
    button { border: 0; border-radius: 10px; padding: 12px 17px; color: #07120f; background: #8bd5bd; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover { background: #a5e5d1; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .field { margin-bottom: 20px; }
    .status { min-height: 26px; margin: 14px 0 0; color: #aab5c6; font-size: .9rem; }
    .status.error { color: #ff9d9d; }
    .answer { margin-top: 20px; padding: 20px 22px; border: 1px solid #2a3545; border-radius: 14px; background: #101722; white-space: pre-wrap; }
    .answer h2 { margin: 0 0 12px; font-size: 1.05rem; }
    .sources { margin-top: 18px; color: #93a3b8; font-size: .86rem; }
    .sources ul { margin: 8px 0 0; padding-left: 20px; }
    .repo { color: #8bd5bd; overflow-wrap: anywhere; }
    @media (max-width: 560px) { main { padding-top: 42px; } .panel { padding: 18px; } .row { align-items: stretch; flex-direction: column; } .row button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Repository Q&amp;A</div>
    <h1>Understand a codebase.</h1>
    <p class="intro">Paste a public GitHub repository link. When indexing finishes, ask questions grounded in its source files.</p>
    <section class="panel" aria-label="Repository and question">
      <form id="repo-form" class="field">
        <label for="repo-url">GitHub repository</label>
        <div class="row"><input id="repo-url" type="url" placeholder="https://github.com/owner/repository" required><button id="index-button">Index repository</button></div>
      </form>
      <div id="repo-name" class="repo" hidden></div>
      <p id="status" class="status" role="status" aria-live="polite">Connect your configured Qdrant, Neo4j, and Groq services to begin.</p>
      <form id="question-form" hidden>
        <div class="field"><label for="question">Ask about the code</label><textarea id="question" placeholder="How does authentication work?" required></textarea></div>
        <button id="ask-button">Ask question</button>
      </form>
      <div id="answer" class="answer" hidden></div>
      <div id="sources" class="sources" hidden></div>
    </section>
  </main>
  <script>
    const repoForm = document.querySelector("#repo-form");
    const questionForm = document.querySelector("#question-form");
    const statusBox = document.querySelector("#status");
    const answerBox = document.querySelector("#answer");
    const sourcesBox = document.querySelector("#sources");
    let repoName = "";

    function setStatus(message, error = false) {
      statusBox.textContent = message;
      statusBox.classList.toggle("error", error);
    }

    async function request(path, options) {
      const response = await fetch(`/api/v1${path}`, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "Request failed");
      return data;
    }

    repoForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.querySelector("#index-button");
      button.disabled = true;
      questionForm.hidden = answerBox.hidden = sourcesBox.hidden = true;
      try {
        const job = await request("/ingest", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({repo_path: document.querySelector("#repo-url").value.trim()})
        });
        setStatus("Cloning and indexing repository files…");
        let result;
        do {
          await new Promise(resolve => setTimeout(resolve, 1800));
          result = await request(`/ingest/${job.job_id}`);
          if (result.status === "running") setStatus("Still indexing. Larger repositories can take a few minutes…");
        } while (result.status === "running");
        if (result.status === "failed") throw new Error(result.error || "Indexing failed");
        repoName = result.repo_name;
        const repoLabel = document.querySelector("#repo-name");
        repoLabel.textContent = `Indexed: ${repoName} · ${result.files} files · ${result.chunks} chunks`;
        repoLabel.hidden = false;
        questionForm.hidden = false;
        setStatus("Ready. Ask a question about this repository.");
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        button.disabled = false;
      }
    });

    questionForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.querySelector("#ask-button");
      button.disabled = true;
      answerBox.hidden = sourcesBox.hidden = true;
      setStatus("Searching the repository and preparing an answer…");
      try {
        const result = await request("/query", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({query: document.querySelector("#question").value.trim(), repo_name: repoName})
        });
        answerBox.replaceChildren();
        const heading = document.createElement("h2");
        heading.textContent = "Answer";
        const text = document.createElement("div");
        text.textContent = result.answer;
        answerBox.append(heading, text);
        answerBox.hidden = false;
        sourcesBox.replaceChildren();
        const title = document.createElement("div");
        title.textContent = "Sources";
        const list = document.createElement("ul");
        result.sources.forEach(source => {
          if (!source.file_path) return;
          const item = document.createElement("li");
          item.textContent = `${source.file_path}:${source.start_line}-${source.end_line}`;
          list.append(item);
        });
        sourcesBox.append(title, list);
        sourcesBox.hidden = list.children.length === 0;
        setStatus("Answer ready.");
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
